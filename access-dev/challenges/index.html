<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Us - Reach Out</title>

        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>

        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="index.css">
    </head>
    <body class="contact-page">
        <main id="main">
            <!-- Form section -->
            <section class="contact-form-section">
                <form>
                    <h1 class="contact-form-heading">Reach <span>Out</span></h1>
                    <p class="contact-form-intro">Curious about something? Complete these fields and "get in touch", as you humans say. 🤙</p>

                    <div class="form-group">
                        <label for="full-name" class="contact-label">Full name</label>
                        <input id="full-name" class="contact-input" type="text" placeholder="e.g., Jane Doe" required />
                    </div>

                    <div class="form-group">
                        <label for="email" class="contact-label">Email</label>
                        <input id="email" class="contact-input" type="email" placeholder="e.g., jane@example.com" required />
                    </div>

                    <div class="form-group">
                        <label for="message" class="contact-label">Your message</label>
                        <textarea id="message" class="contact-textarea" rows="4" cols="50" placeholder="Type your message here..." required></textarea>
                    </div>

                    <button class="contact-submit-button" type="submit">Submit Contact Form</button>
                </form>
                <img class="contact-image" src="images/connect.jpg" alt="Two hands reaching toward each other in connection" />
            </section>
        </main>
    </body>
</html>
